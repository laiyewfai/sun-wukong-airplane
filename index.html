     explicit centre. Each band shifts by exactly its own period P, so the loop
     is seamless because the drawn content repeats every P units. */

  #hillFar  { animation: slideFar    150.0000s linear infinite; }
  #hillMid  { animation: slideMid    84.4444s linear infinite; }
  #hillNear { animation: slideNear   49.2308s linear infinite; }

  @keyframes slideMid    { from { transform:translateX(0); } to { transform:translateX(-760px); } }
  @keyframes slideNear   { from { transform:translateX(0); } to { transform:translateX(-640px); } }

  #plane { animation: bob 3.1s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(-6px); }
                    50%     { transform:translateY(6px);   } }

  @media (prefers-reduced-motion: reduce) {
