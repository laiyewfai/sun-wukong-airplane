     rotation uses SMIL animateTransform with explicit centres. */
  /* Each band shifts by exactly its own period P, so the loop is seamless:
     the drawn content repeats every P units. */
  #clouds   { animation: slideClouds 11.5385s linear infinite; }
  #hillFar  { animation: slideFar    75.0000s linear infinite; }
  #hillMid  { animation: slideMid    42.2222s linear infinite; }
  #hillNear { animation: slideNear   24.6154s linear infinite; }
  @keyframes slideClouds { from { transform:translateX(0); } to { transform:translateX(-300px); } }

  @keyframes slideMid    { from { transform:translateX(0); } to { transform:translateX(-380px); } }
  @keyframes slideNear   { from { transform:translateX(0); } to { transform:translateX(-320px); } }

  /* the plane holds station but rides the air: gentle bob + a touch of pitch */
  #plane { animation: bob 3.1s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(-5px); }
                    50%     { transform:translateY(5px);   } }

  @media (prefers-reduced-motion: reduce) {
    #clouds, #hillFar, #hillMid, #hillNear, #plane { animation:none !important; }
